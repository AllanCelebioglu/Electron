<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electron Video Player</title>
  <style>
    body, html { height: 100%; margin: 0; background: #222; display: flex; align-items: center; justify-content: center; }
    #screen { width: 80vw; height: 80vh; background: #111; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    video { width: 100%; height: 100%; display: none; }
    #prompt { color: #fff; font-size: 2em; }
  </style>
</head>
<body>
  <div id="screen">
    <span id="prompt">Click to select a video</span>
    <video id="video" controls></video>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
